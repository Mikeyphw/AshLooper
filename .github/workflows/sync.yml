name: AshReXcue Fork / Manual Candidate Build

# SAFETY: Replaces inherited workflow that force-pushed to RipperHybrid GitLab.
# This workflow never pushes, publishes a release, or sends files to third parties.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline source syntax
        run: |
          sh -n action.sh customize.sh utils.sh monitor.sh \
            post-fs-data.sh service.sh recovery-notify.sh uninstall.sh
          python3 -m unittest discover -s tests -p 'test_companion_rf02.py' -v
      - name: Build Vite WebUI
        working-directory: webroot
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Assemble core ZIP (no companion bundled)
        run: |
          set -eu
          mkdir -p staging/webroot
          cp -a bin META-INF staging/
          cp -a webroot/dist/. staging/webroot/
          cp -a webroot/cgi-bin staging/webroot/cgi-bin
          cp -a action.sh customize.sh utils.sh monitor.sh module.prop \
            post-fs-data.sh recovery-notify.sh service.sh settings.prop \
            uninstall.sh staging/
          (cd staging && zip -qr ../AshReXcue-Fork-candidate.zip .)
          unzip -l AshReXcue-Fork-candidate.zip | grep 'recovery-notify.sh'
          unzip -t AshReXcue-Fork-candidate.zip | tail -n 1
          sha256sum AshReXcue-Fork-candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ashrexcue-fork-candidate-not-a-release
          path: AshReXcue-Fork-candidate.zip
